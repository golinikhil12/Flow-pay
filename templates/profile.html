{% extends "base.html" %}

{% block title %}User Profile - FlowPay{% endblock %}

{% block content %}
<div class="page-wrapper">
    <div class="page-header">
        <a href="{{ url_for('index') }}" class="back-btn"><i class="fa-solid fa-arrow-left"></i></a>
        <h2>User Profile & Account</h2>
    </div>

    <!-- User Header Avatar Card -->
    <div class="profile-hero-card mb-4">
        <div class="avatar avatar-lg">
            <span>{{ user.name[0] }}</span>
        </div>
        <h3 class="mt-2">{{ user.name }}</h3>
        <p class="text-secondary">{{ user.upi_id }}</p>
        <span class="badge badge-success mt-1"><i class="fa-solid fa-shield-check"></i> FlowPay Verified User</span>
    </div>

    <!-- Edit Profile Details Form -->
    <div class="card form-card mb-4">
        <div class="card-title">
            <i class="fa-solid fa-user-pen text-primary"></i>
            <h3>Personal Information</h3>
        </div>

        <form id="profile-form" class="mt-3">
            <div class="form-group mb-3">
                <label for="prof-name">Full Name</label>
                <input type="text" id="prof-name" value="{{ user.name }}" required class="form-control">
            </div>

            <div class="form-group mb-3">
                <label for="prof-phone">Phone Number</label>
                <input type="text" id="prof-phone" value="{{ user.phone }}" required class="form-control">
            </div>

            <div class="form-group mb-4">
                <label for="prof-upi">VPA / UPI ID</label>
                <input type="text" id="prof-upi" value="{{ user.upi_id }}" required class="form-control">
            </div>

            <div class="card-title mt-4">
                <i class="fa-solid fa-building-columns text-secondary"></i>
                <h3>Linked Bank Details</h3>
            </div>

            <div class="form-group mb-3">
                <label for="prof-bank">Bank Name</label>
                <input type="text" id="prof-bank" value="{{ user.bank_name }}" required class="form-control">
            </div>

            <div class="form-group mb-3">
                <label for="prof-acc">Account Number</label>
                <input type="text" id="prof-acc" value="{{ user.account_number }}" required class="form-control">
            </div>

            <div class="form-group mb-4">
                <label for="prof-ifsc">IFSC Code</label>
                <input type="text" id="prof-ifsc" value="{{ user.ifsc }}" required class="form-control">
            </div>

            <button type="submit" class="btn btn-primary w-100">
                <i class="fa-solid fa-floppy-disk"></i> Save Profile Details
            </button>
        </form>
    </div>
</div>
{% endblock %}
