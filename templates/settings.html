{% extends "base.html" %}

{% block title %}Settings & Security - FlowPay{% endblock %}

{% block content %}
<div class="page-wrapper">
    <div class="page-header">
        <a href="{{ url_for('index') }}" class="back-btn"><i class="fa-solid fa-arrow-left"></i></a>
        <h2>Settings & Security</h2>
    </div>

    <!-- Security PIN Management Card -->
    <div class="card form-card mb-4">
        <div class="card-title">
            <i class="fa-solid fa-key text-primary"></i>
            <h3>Change Security PIN</h3>
        </div>

        <form id="change-pin-form" class="mt-3">
            <div class="form-group mb-3">
                <label for="old-pin">Current 4-Digit PIN</label>
                <input type="password" id="old-pin" maxlength="4" placeholder="••••" required class="form-control pin-input-md">
            </div>

            <div class="form-group mb-4">
                <label for="new-pin">New 4-Digit PIN</label>
                <input type="password" id="new-pin" maxlength="4" placeholder="••••" required class="form-control pin-input-md">
            </div>

            <button type="submit" class="btn btn-primary w-100">
                <i class="fa-solid fa-shield-halved"></i> Update PIN
            </button>
        </form>
    </div>

    <!-- System Reset & Diagnostics Card -->
    <div class="card form-card mb-4">
        <div class="card-title text-danger">
            <i class="fa-solid fa-triangle-exclamation"></i>
            <h3>Factory Reset Demo Data</h3>
        </div>

        <p class="text-secondary mt-2 mb-3">Clear all transaction records and reset wallet balance to default (₹10,000).</p>

        <button onclick="resetSystemData()" class="btn btn-outline-danger w-100">
            <i class="fa-solid fa-trash-arrow-up"></i> Reset All System Data
        </button>
    </div>

    <!-- Logout Action Card -->
    <div class="card form-card">
        <a href="{{ url_for('logout') }}" class="btn btn-danger w-100">
            <i class="fa-solid fa-right-from-bracket"></i> Log Out of Session
        </a>
    </div>
</div>
{% endblock %}
